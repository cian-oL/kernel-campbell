[project]
name = "agent-api"
version = "0.1.0"
description = "API for the Colonel Roy Campbell Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.0",
    "langchain>=1.2.15",
    "langgraph>=1.1.8",
]

[project.scripts]
agent-api = "agent_api:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 weeks"
